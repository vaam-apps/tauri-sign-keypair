# The four language suites.
#
# Split by runner rather than crammed into one job: the Swift codec tests need
# macOS, the Rust desktop tests are fastest on Linux, and the Android unit tests
# need a JDK but no device. Keeping them apart means a failure names the
# language that broke, and a macOS runner is not burned to find out that a
# TypeScript test is red.
#
# What is NOT here, stated plainly rather than left to be discovered: the
# Android instrumented suite (`src/androidTest`) needs a booted device, and the
# iOS plugin surface needs a simulator and a generated Tauri Xcode project.
# Both are run by hand; see README.md's "Running the tests".
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Linux WebView dependencies
        # `tauri` links against webkit2gtk even for a headless test binary, so
        # this is not optional on a bare runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The one place the Linux TPM module can be compiled at all — it needs the
      # tpm2-tss C libraries, which no other machine in this project has.
      #
      # This is a REQUIRED check. It was `continue-on-error` while the module
      # did not compile, and that masked the failure: with continue-on-error a
      # failed step still reports `conclusion: success` through the API, and
      # only `outcome` shows the truth — the job looked green while the compiler
      # emitted six errors. Now that it compiles, the tick means something, so
      # let it block.
      - name: Linux TPM backend (compiles; never run against a TPM)
        run: |
          sudo apt-get install -y libtss2-dev
          cargo clippy --features linux-tpm -- -D warnings

  cross-targets:
    name: cross-check the mobile and Windows targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-linux-android
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      # `cargo check` does not link, so a cross target needs no foreign linker.
      # This is the only verification the Windows backend has — there is no
      # Windows runner in this workflow — so it is a required check, not
      # informational.
      - run: cargo check --target x86_64-pc-windows-msvc
      - run: cargo check --target aarch64-linux-android

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  swift:
    name: swift
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pure SwiftPM: no simulator, no Tauri runtime, no keychain. The sources
      # under darwin_tests/Sources are symlinks to the files the plugin ships,
      # so this exercises the real code rather than a copy that could drift.
      - name: Codec and wire-contract tests
        working-directory: darwin_tests
        run: swift test

  kotlin:
    name: kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # No `setup-android` action. The ubuntu runner already ships the SDK at
      # $ANDROID_HOME, and the action re-runs sdkmanager to install packages it
      # already has — which is how it was failing here. What the runner does not
      # export is NDK_HOME, and `tauri android init` needs it, so resolve the
      # bundled NDK rather than downloading another one.
      - name: Point Tauri at the runner's bundled NDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          ndk=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          test -n "$ndk"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "using NDK $ndk"
      # `android/` is a Gradle subproject with no wrapper and no settings of its
      # own — it cannot be built standalone. `tauri android init` generates the
      # host project whose `tauri.settings.gradle` includes it as
      # `:tauri-plugin-sign-keypair` and supplies its `app.tauri.*` dependencies.
      - name: Generate the host Android project
        run: |
          npm install && npm run build
          cd examples/tauri-app && npm install && npx tauri android init
      # `tauri.settings.gradle` is the file that includes the plugin as
      # `:tauri-plugin-sign-keypair`, and without it Gradle cannot even evaluate
      # settings. Neither `tauri android init` nor a bare `cargo check` writes
      # it — it comes from the `android-studio-script` step that Tauri's Gradle
      # plugin runs during a real Android build, which is why this does the full
      # build rather than something cheaper. One ABI only, to keep it bearable.
      - name: Android build, which writes tauri.settings.gradle
        working-directory: examples/tauri-app
        run: npx tauri android build --debug --target aarch64 --apk
      - name: JVM unit tests
        working-directory: examples/tauri-app/src-tauri/gen/android
        run: ./gradlew :tauri-plugin-sign-keypair:testDebugUnitTest --no-daemon
